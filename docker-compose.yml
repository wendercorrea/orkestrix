# Orkestrix a partir do Docker Hub: baixa as imagens prontas e sobe tudo, sem compilar nada.
#
#   1. cp .env.example .env                    (edite os 4 segredos)
#   2. docker compose up -d                    (o repositório é público: não precisa de docker login)
#   3. abra http://localhost:8080              (usuário admin; senha = ADMIN_PASSWORD do .env)
#   API Gateway: http://localhost:8090/api/v1/docs  (Swagger); publicar APIs pelo designer: botão «Publicar no API Gateway»
#
# Imagens: wendercorrea/orkestrix:<componente>-<versão>  (backend-, frontend-, gateway-)
# Mudar de versão: ORKESTRIX_VERSION no .env e «docker compose pull && docker compose up -d».
name: orkestrix

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orkestrix}
      POSTGRES_USER: ${POSTGRES_USER:-orkestrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [orkestrix]
    restart: unless-stopped

  # O nome do serviço precisa continuar «orkestrix-backend»: o nginx do front resolve esse nome.
  orkestrix-backend:
    image: wendercorrea/orkestrix:backend-${ORKESTRIX_VERSION:-4.1.11}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-orkestrix}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-orkestrix}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update          # cria as tabelas na primeira subida
      ORKESTRIX_JWT_SECRET: ${ORKESTRIX_JWT_SECRET:?Defina ORKESTRIX_JWT_SECRET (32+ caracteres) no arquivo .env}
      ORKESTRIX_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no arquivo .env}
      ORKX_SECRETS_KEY: ${ORKX_SECRETS_KEY:?Defina ORKX_SECRETS_KEY no arquivo .env}
      # «Publicar no API Gateway» no designer: o backend chama a Management API do gateway (porta 8081, só na rede interna)
      ORKX_GW_MANAGEMENT_URL: http://orkestrix-gateway:8081
      ORKX_GW_MANAGEMENT_TOKEN: ${ORKX_GW_MANAGEMENT_TOKEN:?Defina ORKX_GW_MANAGEMENT_TOKEN (32+ caracteres) no arquivo .env}
      ORKX_GW_PUBLIC_URL: ${ORKX_GW_PUBLIC_URL:-}     # endereço público do gateway, só para o exemplo curl do designer
      SERVER_PORT: 9000
      ORKESTRIX_CONNECTORS_FILE_BASE_DIR: /app/shared
      # limites e retenção (todos opcionais no .env; sem eles valem os padrões abaixo, que são os de sempre)
      ORKX_FILE_MAX_READ_SIZE: ${ORKX_FILE_MAX_READ_SIZE:-5MB}                  # maior arquivo que o conector «file» lê
      ORKX_SPREADSHEET_MAX_ROWS: ${ORKX_SPREADSHEET_MAX_ROWS:-2000000}          # linhas lidas por nó de planilha quando o nó não diz outro limite
      ORKX_SPREADSHEET_COLLECT_MAX_ROWS: ${ORKX_SPREADSHEET_COLLECT_MAX_ROWS:-50000}   # idem, quando o nó passa as linhas pelo fluxo (collect)
      ORKX_REST_PREVIEW_MAX_SIZE: ${ORKX_REST_PREVIEW_MAX_SIZE:-1MB}            # maior resposta do «Enviar» da chamada REST no editor (até 64MB)
      ORKX_VARIABLE_INLINE_MAX_CHARS: ${ORKX_VARIABLE_INLINE_MAX_CHARS:-65536}  # acima disto o valor de uma variável vai para tabela própria (0 desliga)
      ORKX_VARIABLE_WARN_CHARS: ${ORKX_VARIABLE_WARN_CHARS:-5000000}            # o log avisa quando uma variável passa disto (0 não avisa)
      ORKX_RETENTION_INSTANCES_DAYS: ${ORKX_RETENTION_INSTANCES_DAYS:-0}        # apaga instâncias terminadas há mais de N dias; 0 = nunca apaga
    volumes:
      - ./files:/app/shared                          # pasta que os conectores de planilha e arquivo enxergam
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [orkestrix]
    restart: unless-stopped

  frontend:
    image: wendercorrea/orkestrix:frontend-${ORKESTRIX_VERSION:-4.1.11}
    environment:
      ORKX_MAX_BODY_SIZE: ${ORKX_MAX_BODY_SIZE:-1m}   # maior corpo de requisição aceito pela tela (publicar/importar BPMN grande); formato do nginx: 512k, 20m, 1g
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - orkestrix-backend
    networks: [orkestrix]
    restart: unless-stopped

  # API Gateway: porta de entrada externa para iniciar processos por HTTP, com chave de API e Swagger (em /api/v1/docs).
  # Catálogo em banco (schema orkx_gateway) e contrato interno, que é o que o «Publicar no API Gateway» do designer usa.
  orkestrix-gateway:
    image: wendercorrea/orkestrix:gateway-${ORKESTRIX_VERSION:-4.1.11}
    environment:
      ORKX_GW_BACKEND_URL: http://orkestrix-backend:9000
      # usuário com o qual o gateway chama o Orkestrix (padrão: o admin, com a senha do .env)
      ORKX_GW_SERVICE_USER: ${ORKX_GW_SERVICE_USER:-admin}
      ORKX_GW_SERVICE_PASSWORD: ${ORKX_GW_SERVICE_PASSWORD:-${ADMIN_PASSWORD}}
      ORKX_GW_API_KEY_PEPPER: ${ORKX_GW_API_KEY_PEPPER:?Defina ORKX_GW_API_KEY_PEPPER (32+ caracteres) no arquivo .env}
      ORKX_GW_ENGINE_API: internal
      ORKX_GW_CATALOG_STORE: database
      ORKX_GW_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-orkestrix}
      ORKX_GW_DATABASE_USER: ${POSTGRES_USER:-orkestrix}
      ORKX_GW_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      ORKX_GW_MANAGEMENT_TOKEN: ${ORKX_GW_MANAGEMENT_TOKEN:?Defina ORKX_GW_MANAGEMENT_TOKEN (32+ caracteres) no arquivo .env}
      ORKX_GW_PUBLIC_URL: ${ORKX_GW_PUBLIC_URL:-}
      ORKX_GW_MAX_RESULT_SIZE: ${ORKX_GW_MAX_RESULT_SIZE:-2MB}   # maior resposta do Orkestrix lida pelo gateway (response.body com muitas linhas)
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/catalogo.yml
    volumes:
      - ./gateway/catalogo.yml:/app/config/catalogo.yml:ro
    ports:
      - "${GATEWAY_PORT:-8090}:8080"                 # a 8081 (gestão) não é publicada
    depends_on:
      orkestrix-backend:
        condition: service_healthy
    networks: [orkestrix]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]

volumes:
  postgres_data:

networks:
  orkestrix:
